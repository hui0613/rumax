# cbindgen configuration for generating include/rumax.h
#
# Usage:
#   cargo install cbindgen
#   cbindgen --config cbindgen.toml --crate rumax --output include/rumax.h

language = "C"
include_guard = "RUMAX_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
tab_width = 4
line_length = 100
header = "/* Generated by cbindgen. Do not edit manually. See include/rumax.h. */"
include_version = true

[export]
include = [
    "RumaxClient",
    "rumax_event_cb",
    "rumax_client_new",
    "rumax_client_free",
    "rumax_client_connect",
    "rumax_client_disconnect",
    "rumax_client_is_connected",
    "rumax_client_set_host",
    "rumax_client_set_custom_ca",
    "rumax_client_set_token",
    "rumax_client_get_token",
    "rumax_client_set_user_id",
    "rumax_client_call",
    "rumax_client_set_event_callback",
    "rumax_generate_web_identity",
    "rumax_client_login_by_token",
    "rumax_qr_login_request",
    "rumax_qr_login_confirm",
    "rumax_send_message",
    "rumax_string_free",
    "rumax_version",
]
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]

[fn]
args = "horizontal"
rename_args = "none"

[defines]
"target_os = linux" = "RUMAX_TARGET_LINUX"
